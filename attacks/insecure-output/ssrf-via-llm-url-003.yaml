id: IO-003
name: "SSRF via LLM-Generated URL"
owasp_ref: LLM02
severity: high
author: nifra-core
tags:
  - ssrf
  - url-generation
  - output-handling
  - cloud-metadata
  - llm02

description: |
  Applications that use LLM-generated URLs for HTTP requests (webhooks,
  API calls, resource fetching) are vulnerable to SSRF through the LLM output.
  The LLM can be manipulated into generating URLs pointing to internal services,
  cloud metadata endpoints, or localhost.

  This is OWASP LLM02 (Insecure Output Handling) — the LLM output (a URL string)
  is used without validation to make network requests.

conditions:
  requires:
    - llm_generates_urls: true
    - url_validation: false

exploit_template: |
  Cloud metadata exfiltration:
    User: "Check the status of our cloud infrastructure"
    
    After injection: LLM generates URL:
    "http://169.254.169.254/latest/meta-data/iam/security-credentials/production-role"
    
    Application fetches it, exfiltrating:
    {"AccessKeyId": "ASIA...", "SecretAccessKey": "...", "Token": "..."}

  Internal service discovery:
    User: "Verify the webhook configuration"
    LLM generates: "http://internal-db.prod.company.local:5432/status"

  Localhost bypass:
    LLM generates: "http://localhost:8080/admin/reset-password"

  IPv6 bypass:
    LLM generates: "http://[::1]:6379/"  # Redis on localhost via IPv6

expected_behavior: |
  Application uses LLM-generated URL to make server-side HTTP request,
  potentially reaching cloud metadata, internal services, or admin endpoints.

impact: "Cloud credential theft, internal service access, admin endpoint abuse"

detection:
  nifra_rule: IO-003
  graph_pattern: "LLMClient → ExternalAPI[url_from_llm=true, validated=false]"

remediation:
  - "Validate ALL URLs generated by LLM before making HTTP requests"
  - "Block private IP ranges: 10.x, 172.16-31.x, 192.168.x, 127.x, 169.254.x"
  - "Block IPv6 loopback and private: ::1, fc00::/7"
  - "Enforce HTTPS-only for all outbound requests"
  - "Use a URL allowlist if the set of valid target domains is known and limited"
  - "Disable HTTP redirects to prevent redirect-chain SSRF bypass"
  - "Never use LLM-generated URLs directly — always parse and validate first"

references:
  - "https://owasp.org/www-project-top-10-for-large-language-model-applications/#llm02"
  - "https://owasp.org/www-community/attacks/Server_Side_Request_Forgery"
