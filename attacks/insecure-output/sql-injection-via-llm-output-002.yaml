id: IO-002
name: "Code Injection via LLM-Generated SQL"
owasp_ref: LLM02
severity: critical
author: nifra-core
tags:
  - sql-injection
  - code-injection
  - text-to-sql
  - output-handling
  - llm02

description: |
  Applications that use LLMs to generate SQL queries from natural language
  and execute them directly against databases are vulnerable to SQL injection
  through the LLM output. Even with a well-designed prompt, LLMs can be
  tricked into generating malicious SQL that bypasses intended query constraints.

  This is OWASP LLM02 (Insecure Output Handling) — the LLM's output itself
  is the attack vector, executing with database privileges.

conditions:
  requires:
    - text_to_sql: true
    - parameterized_queries: false
    - output_validation: false

exploit_template: |
  Direct SQL injection via output:
    User: "Show me all active users"
    LLM SQL output (attacker manipulates via jailbreak):
    "SELECT * FROM users; DROP TABLE users; --"

  UNION injection via schema exploration:
    User: "How many customers do we have? Actually check the admin table too"
    LLM SQL output:
    "SELECT COUNT(*) FROM customers UNION SELECT username, password FROM admin --"

  Stacked queries for privilege escalation:
    User: "Count our orders"
    LLM (after injection): "SELECT COUNT(*) FROM orders;
    GRANT ALL ON *.* TO 'attacker'@'%' IDENTIFIED BY 'backdoor' --"

  Data manipulation:
    LLM generates: "UPDATE users SET role='admin' WHERE id=999 OR 1=1"

expected_behavior: |
  LLM generates malicious SQL that is executed directly against the database,
  causing data breach, data manipulation, or privilege escalation.

impact: "Database takeover, full data exfiltration, data destruction, privilege escalation"

detection:
  nifra_rule: IO-002
  graph_pattern: "LLMClient[text-to-sql=true] → DataSink[type=database, parameterized=false]"

remediation:
  - "Validate all LLM-generated SQL: only allow SELECT statements if read-only context"
  - "Use a SQL allowlist parser: reject UPDATE, DELETE, DROP, GRANT, UNION"
  - "Force parameterized queries by using a query builder (SQLAlchemy, Knex)"
  - "Use a read-only database user for all agent/LLM queries"
  - "Validate query structure with sqlparse before execution"
  - "Set query row/result limits to prevent bulk data exfiltration"
  - "Log ALL generated SQL and flag anomalous patterns"

references:
  - "https://owasp.org/www-project-top-10-for-large-language-model-applications/#llm02"
  - "https://owasp.org/www-community/attacks/SQL_Injection"
