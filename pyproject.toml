[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nifra"
version = "0.1.0"
description = "AI Application Security Autopilot — Exploit simulation, attack surface mapping & pipeline protection for LLM apps and AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "ReyraLabs", email = "lab@reyralabs.com" },
  { name = "NIfra Contributors" },
]
keywords = [
    "ai security",
    "llm security",
    "prompt injection",
    "ai pentest",
    "ai red team",
    "langchain security",
    "ai agent security",
    "owasp llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "networkx>=3.2.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pygments>=2.17.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[project.scripts]
nifra = "nifra.cli.main:app"

[project.urls]
Homepage = "https://github.com/reyracom/Nifra-Agent"
Repository = "https://github.com/reyracom/Nifra-Agent"
Issues = "https://github.com/reyracom/Nifra-Agent/issues"
Documentation = "https://github.com/reyracom/Nifra-Agent/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["nifra"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nifra --cov-report=term-missing"
